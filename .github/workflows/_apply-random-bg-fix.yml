name: apply-random-bg-fix

on:
  push:
    branches:
      - agent/random-bg-fill-active

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/Ai/Base/Actions/BattleGroundJoinAction.cpp")
          text = path.read_text()

          needle = '''    uint32 BracketSize = bg->GetMaxPlayersPerTeam() * 2;\n    uint32 TeamSize = bg->GetMaxPlayersPerTeam();\n'''
          replacement = '''    uint32 BracketSize = bg->GetMaxPlayersPerTeam() * 2;\n    uint32 TeamSize = bg->GetMaxPlayersPerTeam();\n\n    // Random battlegrounds use a 10v10 pseudotype only to create the initial instance.\n    // Once a real random BG exists, use its actual free slots instead of the pseudotype size.\n    if (bgTypeId == BATTLEGROUND_RB)\n    {\n        bool hasActiveRandomBg = false;\n        for (Battleground const* activeBg : sBattlegroundMgr->GetActiveBattlegrounds())\n        {\n            if (activeBg->GetBgTypeID() != BATTLEGROUND_RB || activeBg->GetBracketId() != bracketId)\n                continue;\n\n            hasActiveRandomBg = true;\n            if (activeBg->GetFreeSlotsForTeam(teamId) > 0)\n                return true;\n        }\n\n        if (hasActiveRandomBg)\n            return false;\n    }\n'''

          if text.count(needle) != 2:
              raise SystemExit(f"expected 2 battleground sizing blocks, found {text.count(needle)}")

          text = text.replace(needle, replacement)
          path.write_text(text)
          PY

          git diff --check

      - name: Commit and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/_apply-random-bg-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Ai/Base/Actions/BattleGroundJoinAction.cpp .github/workflows/_apply-random-bg-fix.yml
          git commit -m "Fix random battleground bot filling"
          git push origin HEAD:agent/random-bg-fill-active
